packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm 11+).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@remotion/compositor-linux-x64-gnu": true
  "@remotion/compositor-win32-x64-msvc": true

minimumReleaseAgeExclude:
  - hyperframes@0.9.19

# Same list for pnpm 10.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - "@remotion/compositor-linux-x64-gnu"
  - "@remotion/compositor-win32-x64-msvc"
